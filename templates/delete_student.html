
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Student</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 40px;
        }

        .delete-container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #dc2626;
        }

        .student-name {
            font-size: 22px;
            font-weight: bold;
            margin: 20px 0;
        }

        .warning {
            color: #555;
            margin-bottom: 25px;
        }

        button {
            padding: 12px 20px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .cancel {
            display: inline-block;
            padding: 12px 20px;
            background: #6b7280;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-left: 10px;
        }
    </style>
</head>

<body>

<div class="delete-container">

    <h1>Delete Student</h1>

    <p>Are you sure you want to delete:</p>

    <div class="student-name">
        {{ student.name }}
    </div>

    <p class="warning">
        This action cannot be undone.
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

        <a href="{% url 'students' %}" class="cancel">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
