
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .create-btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 10px 16px;
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #2563eb;
            color: white;
        }

        .btn {
            padding: 7px 12px;
            border-radius: 5px;
            text-decoration: none;
            color: white;
            margin-right: 5px;
        }

        .view {
            background: #16a34a;
        }

        .update {
            background: #f59e0b;
        }

        .delete {
            background: #dc2626;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Students List</h1>

    <a href="{% url 'create_student' %}" class="create-btn">
        + Add Student
    </a>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Age</th>
                <th>Course</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>

            {% for student in students %}

            <tr>
                <td>{{ student.id }}</td>
                <td>{{ student.name }}</td>
                <td>{{ student.email }}</td>
                <td>{{ student.age }}</td>
                <td>{{ student.course }}</td>

                <td>
                    <a href="{% url 'student' student.id %}"
                       class="btn view">
                        View
                    </a>

                    <a href="{% url 'update_student' student.id %}"
                       class="btn update">
                        Edit
                    </a>

                    <a href="{% url 'delete_student' student.id %}"
                       class="btn delete">
                        Delete
                    </a>
                </td>
            </tr>

            {% empty %}

            <tr>
                <td colspan="6" style="text-align:center;">
                    No students found.
                </td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
